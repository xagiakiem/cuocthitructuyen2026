<title>Cuộc thi Tìm hiểu Pháp luật xã Gia Kiệm 2026</title>
<link href="./hoàn thiện_files/css2" rel="stylesheet">
<style>
  :root {
    --red:       #c0392b;
    --red-dark:  #922b21;
    --red-light: #fadbd8;
    --gold:      #d4a017;
    --gold-light:#fdf3d0;
    --navy:      #1a2a4a;
    --navy-mid:  #2c3e6b;
    --white:     #ffffff;
    --off-white: #fdfaf5;
    --grey-100:  #f4f6f9;
    --grey-200:  #e8edf4;
    --grey-400:  #adb5bd;
    --grey-600:  #6c757d;
    --text:      #1c2438;
    --shadow-sm: 0 2px 8px rgba(26,42,74,0.08);
    --shadow-md: 0 6px 24px rgba(26,42,74,0.13);
    --shadow-lg: 0 16px 48px rgba(26,42,74,0.18);
    --radius:    12px;
    --radius-lg: 18px;
  }

  * { box-sizing: border-box; }

  body {
    font-family: 'Be Vietnam Pro', sans-serif;
    margin: 0;
    background-image: url("https://lh3.googleusercontent.com/u/0/d/1nt7jcYXS6P1-zMgHRQqrnOjWzpqIBlmK");
    background-attachment: fixed;
    background-repeat: no-repeat;
    background-size: cover;
    background-position: center;
    display: flex;
    justify-content: center;
    min-height: 100vh;
    color: var(--text);
  }

  /* ── Wrapper ── */
  .main {
    width: 100%;
    max-width: 980px;
    padding: 0 0 40px;
    background: transparent;
    min-height: 100vh;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  /* Phần nội dung bên dưới banner: có nền mờ nhẹ để dễ đọc */
  .content-area {
    background: rgba(240, 244, 248, 0.15);
    backdrop-filter: blur(6px) saturate(120%) brightness(1.02);
    -webkit-backdrop-filter: blur(6px) saturate(120%) brightness(1.02);
    box-shadow: 0 8px 48px rgba(0,0,0,0.15), inset 0 0 0 1px rgba(255,255,255,0.40);
    flex: 1;
  }

  /* Banner */
  .main > div:first-child {
    position: relative;
    background: transparent;
  }
  .main > div:first-child::after {
    content: '';
    display: block;
    height: 5px;
    background: linear-gradient(90deg, var(--red-dark), var(--gold), var(--red-dark));
  }
  .main > div:first-child img {
    display: block;
    width: 100%;
  }

  /* ── Info screen ── */
  #info-screen {
    text-align: center;
    padding: 36px 24px 10px;
  }

  .input-group {
    text-align: left;
    max-width: 520px;
    margin: 0 auto;
    background: var(--white);
    padding: 36px 36px 28px;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-md);
    border-top: 4px solid var(--red);
    position: relative;
    overflow: hidden;
  }

  .input-group::before {
    content: '⚖';
    position: absolute;
    top: -10px; right: 20px;
    font-size: 80px;
    opacity: 0.04;
    color: var(--navy);
    line-height: 1;
  }

  .input-group h2 {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 900;
    color: var(--navy);
    text-align: center;
    margin: 0 0 24px;
    letter-spacing: 0.5px;
    position: relative;
    padding-bottom: 14px;
  }
  .input-group h2::after {
    content: '';
    position: absolute;
    bottom: 0; left: 50%; transform: translateX(-50%);
    width: 56px; height: 3px;
    background: linear-gradient(90deg, var(--red), var(--gold));
    border-radius: 2px;
  }

  .input-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--navy-mid);
    margin-bottom: 5px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }

  input {
    width: 100%;
    padding: 11px 14px;
    margin-bottom: 16px;
    border: 1.5px solid var(--grey-200);
    border-radius: 8px;
    font-size: 15px;
    font-family: 'Be Vietnam Pro', sans-serif;
    background: var(--grey-100);
    color: var(--text);
    transition: border-color .2s, box-shadow .2s, background .2s;
    outline: none;
  }
  input:focus {
    border-color: var(--red);
    background: var(--white);
    box-shadow: 0 0 0 3px rgba(192,57,43,0.1);
  }
  input::placeholder { color: var(--grey-400); }

  .btn-start {
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, var(--red-dark), var(--red));
    color: var(--white) !important;
    border: none;
    border-radius: 40px !important;
    font-family: 'Be Vietnam Pro', sans-serif;
    font-weight: 700;
    font-size: 16px !important;
    letter-spacing: 1.5px;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(192,57,43,0.35);
    transition: transform .15s, box-shadow .15s, background .2s;
    position: relative;
    overflow: hidden;
    margin-top: 4px;
  }
  .btn-start:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(192,57,43,0.45);
  }
  .btn-start:active { transform: translateY(0); }

  /* ── QR Section ── */
  .qr-section {
    margin: 28px 24px 0;
    padding: 20px 24px;
    background: var(--white);
    border-radius: var(--radius);
    border: 1.5px solid var(--grey-200);
    display: flex;
    align-items: center;
    gap: 20px;
    box-shadow: var(--shadow-sm);
  }
  .qr-section p { margin: 0; }
  .qr-code-img {
    max-width: 100px;
    flex-shrink: 0;
    border: 2px solid var(--grey-200);
    border-radius: 8px;
    padding: 4px;
    background: white;
    margin-top: 0 !important;
  }

  /* ── Quiz Screen ── */
  #quiz-screen { padding: 24px 24px 0; }

  /* Quiz layout */
  .quiz-container { display: flex; gap: 22px; align-items: flex-start; }
  .questions-section { flex: 3; }

  /* Sidebar navigation */
  .navigation-section {
    flex: 1;
    position: sticky;
    top: 20px;
    height: fit-content;
    background: var(--white);
    padding: 18px;
    border-radius: var(--radius);
    border: 1.5px solid var(--grey-200);
    text-align: center;
    box-shadow: var(--shadow-sm);
  }
  .navigation-section > b {
    font-family: 'Playfair Display', serif;
    font-size: 15px;
    color: var(--navy);
    letter-spacing: 0.5px;
  }

  /* Question cards */
  .question-card {
    margin-bottom: 20px;
    padding: 22px 24px;
    background: var(--white);
    border-radius: var(--radius);
    border-left: 5px solid var(--red);
    box-shadow: var(--shadow-sm);
    transition: box-shadow .2s;
  }
  .question-card:hover { box-shadow: var(--shadow-md); }
  .question-card > b {
    font-size: 15px;
    line-height: 1.6;
    color: var(--navy);
    display: block;
    margin-bottom: 4px;
  }

  /* Answer options */
  .answer-option {
    display: flex;
    align-items: flex-start;
    padding: 11px 14px;
    cursor: pointer;
    border: 1.5px solid var(--grey-200);
    margin-bottom: 9px;
    border-radius: 8px;
    text-align: left;
    background: var(--grey-100);
    transition: background .15s, border-color .15s, box-shadow .15s;
    font-size: 14.5px;
    line-height: 1.55;
  }
  .answer-option:hover {
    background: var(--red-light);
    border-color: var(--red);
    box-shadow: 0 2px 8px rgba(192,57,43,0.1);
  }
  .answer-option input[type="radio"] {
    margin: 3px 12px 0 0;
    width: 18px; height: 18px;
    flex-shrink: 0;
    accent-color: var(--red);
    cursor: pointer;
    margin-bottom: 0;
    padding: 0;
    border: none;
    background: none;
    box-shadow: none;
  }

  /* Nav grid */
  .nav-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 7px;
    margin-top: 14px;
  }
  .nav-item {
    padding: 9px 4px;
    background: var(--grey-100);
    border: 1.5px solid var(--grey-200);
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 700;
    color: var(--navy-mid);
    transition: background .15s, border-color .15s, color .15s, transform .1s;
  }
  .nav-item:hover { background: var(--red-light); border-color: var(--red); transform: scale(1.06); }
  .nav-item.active {
    background: linear-gradient(135deg, #27ae60, #2ecc71);
    color: var(--white);
    border-color: #1e8449;
    box-shadow: 0 2px 8px rgba(39,174,96,0.3);
  }

  /* Submit button */
  #submit-btn {
    background: linear-gradient(135deg, #1e8449, #28a745);
    color: var(--white);
    border: none;
    padding: 18px;
    font-size: 18px;
    font-family: 'Be Vietnam Pro', sans-serif;
    font-weight: 700;
    letter-spacing: 2px;
    border-radius: var(--radius);
    cursor: pointer;
    width: 100%;
    margin-top: 28px;
    box-shadow: 0 4px 18px rgba(40,167,69,0.35);
    transition: transform .15s, box-shadow .15s;
  }
  #submit-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(40,167,69,0.45);
  }

  /* Divider */
  hr { border: 0; border-top: 1.5px solid var(--grey-200); }

  /* ── Responsive ── */
  @media (max-width: 768px) {
    .quiz-container { flex-direction: column; }
    .navigation-section { position: static; order: -1; }
    .input-group { padding: 26px 20px 22px; }
    .qr-section { flex-direction: column; text-align: center; margin: 20px 14px 0; }
    #quiz-screen { padding: 14px 14px 0; }
  }
</style>
</head>

let shuffled, startTime, countdown;
let timeLeft = 20 * 60;

function showDoneScreen() {
  // Ẩn tất cả màn hình, chỉ hiện result-screen
  var info = document.getElementById("info-screen");
  var quiz = document.getElementById("quiz-screen");
  if (info) info.style.display = "none";
  if (quiz) quiz.style.display = "none";
  var r = document.getElementById("result-screen");
  if (r) r.style.display = "block";
}

document.addEventListener('contextmenu', event => event.preventDefault());

// Chặn phím tắt
document.onkeydown = function (e) {
    if (e.keyCode == 123) return false; // F12
    if (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false; // Ctrl+Shift+I
    if (e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) return false; // Ctrl+Shift+C
    if (e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false; // Ctrl+Shift+J
    if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false; // Ctrl+U (Xem nguồn)
}

function startQuiz() {
  const name = document.getElementById("name").value.trim();
  const birth = document.getElementById("birth").value.trim();
  const address = document.getElementById("address").value.trim();
  const cccd = document.getElementById("cccd").value.trim();
  const phone = document.getElementById("phone").value.trim();

  if(!name || !birth || !address || !cccd || !phone) {
    return alert("Vui lòng điền đầy đủ các thông tin có dấu (*)");
  }

  // Kiểm tra localStorage theo CCCD — chặn thi lại ngay trên trình duyệt
  if(localStorage.getItem("done_" + cccd)) {
    return showDoneScreen();
  }

  const btn = document.querySelector(".btn-start");
  btn.innerText = "ĐANG KIỂM TRA HỆ THỐNG...";
  btn.disabled = true;

  // SỬ DỤNG JSONP ĐỂ THÔNG NGHẼN KẾT NỐI
  const callbackName = 'jsonpCallback_' + Math.round(100000 * Math.random());
  
  window[callbackName] = function(data) {
    delete window[callbackName];
    const scriptTag = document.getElementById('jsonpScript');
    if (scriptTag) scriptTag.remove();

    if (data.status === "exists") {
      alert("Số CCCD này đã tham gia thi trước đó. Mỗi thí sinh chỉ được thi 1 lần!");
      btn.innerText = "BẮT ĐẦU THI";
      btn.disabled = false;
    } else {
      // VÀO THI THÀNH CÔNG
      document.getElementById("info-screen").style.display = "none";
      document.getElementById("quiz-screen").style.display = "block";
      renderQuiz();
      startTime = Date.now();
      countdown = setInterval(updateTimer, 1000);
    }
  };

  // Timeout 8 giây: nếu không có phản hồi từ server thì cho vào thi luôn
  const jsonpTimeout = setTimeout(function() {
    delete window[callbackName];
    var old = document.getElementById('jsonpScript');
    if (old) old.remove();
    console.warn("Timeout kết nối Google Sheet — cho phép vào thi (sẽ lưu kết quả sau).");
    document.getElementById("info-screen").style.display = "none";
    document.getElementById("quiz-screen").style.display = "block";
    renderQuiz();
    startTime = Date.now();
    countdown = setInterval(updateTimer, 1000);
  }, 8000);

  // Bọc callback gốc để cũng xóa timeout
  var originalCb = window[callbackName];
  window[callbackName] = function(data) {
    clearTimeout(jsonpTimeout);
    originalCb(data);
  };

  const script = document.createElement('script');
  script.id = 'jsonpScript';
  script.src = `${SCRIPT_URL}?action=checkCCCD&cccd=${encodeURIComponent(cccd)}&callback=${callbackName}`;
  script.onerror = function() {
    clearTimeout(jsonpTimeout);
    delete window[callbackName];
    // Khi lỗi mạng, vẫn cho vào thi (kết quả sẽ được lưu khi nộp bài)
    console.warn("Lỗi kết nối khi kiểm tra CCCD — cho phép vào thi.");
    document.getElementById("info-screen").style.display = "none";
    document.getElementById("quiz-screen").style.display = "block";
    renderQuiz();
    startTime = Date.now();
    countdown = setInterval(updateTimer, 1000);
  };
  document.body.appendChild(script);
}


function updateTimer() {
  let m = Math.floor(timeLeft/60), s = timeLeft%60;
  document.getElementById("timer").innerText = `${m}:${s<10?'0':''}${s}`;
  if(timeLeft <= 0) { 
    clearInterval(countdown); 
    submitQuiz(); 
  }
  timeLeft--;
}

function renderQuiz() {
  const content = document.getElementById("quiz-content");
  const nav = document.getElementById("nav-grid");
  content.innerHTML = ""; 
  nav.innerHTML = "";

  // 1. Tạo bản sao và xáo trộn toàn bộ ngân hàng câu hỏi gốc
  let allShuffled = [...questionsBank].sort(() => Math.random() - 0.5);

  // 2. Lấy đúng 20 câu đầu tiên sau khi đã đảo vị trí
  shuffled = allShuffled.slice(0, 20);

  shuffled.forEach((q, i) => {
    // Giữ nguyên thứ tự câu trả lời, chỉ random câu hỏi
    let card = document.createElement("div");
    card.className = "question-card";
    card.id = "question-box-" + i;
    
    let html = `<b>Câu ${i+1}: ${q.q}</b><br><br>`;
    
    q.a.forEach((ans, ansIdx) => {
      const isRight = (ansIdx === q.correct);
      
      html += `<label class="answer-option">
                <input type="radio" name="q${i}" value="${isRight}" onchange="updateNav(${i})">
                <span>${ans}</span>
              </label>`;
    });
    
    card.innerHTML = html;
    content.appendChild(card);

    // Tạo nút số thứ tự bên phải
    let navBtn = document.createElement("div");
    navBtn.className = "nav-item";
    navBtn.id = "nav-item-" + i;
    navBtn.innerText = i + 1;
    navBtn.onclick = () => document.getElementById("question-box-"+i).scrollIntoView({behavior: 'smooth'});
    nav.appendChild(navBtn);
  });
}

function updateNav(index) {
  document.getElementById("nav-item-" + index).classList.add("active");
}

function submitQuiz() {
  clearInterval(countdown);

  // Vô hiệu hóa nút nộp bài ngay lập tức để tránh bấm 2 lần
  var submitBtn = document.getElementById("submit-btn");
  if (submitBtn) { submitBtn.disabled = true; submitBtn.innerText = "ĐANG NỘP BÀI..."; }

  let correctCount = 0;
  shuffled.forEach((q, i) => {
    const selected = document.querySelector(`input[name="q${i}"]:checked`);
    if (selected && selected.value === "true") correctCount++;
  });

  const totalQ   = shuffled.length;
  const percent  = ((correctCount / totalQ) * 100).toFixed(2);
  const timeUsed = Math.floor((Date.now() - startTime) / 1000);

  const payload = {
    name:       document.getElementById("name").value.trim(),
    birth:      document.getElementById("birth").value.trim(),
    address:    document.getElementById("address").value.trim(),
    cccd:       document.getElementById("cccd").value.trim(),
    phone:      document.getElementById("phone").value.trim(),
    score:      `${correctCount}/${totalQ}`,
    percentage: percent + "%",
    time:       timeUsed + " giây"
  };

  // Ghi localStorage ngay để chặn thi lại kể cả khi mạng lỗi
  localStorage.setItem("done_" + payload.cccd, "true");

  // ── Hiển thị màn hình kết quả NGAY (không dùng alert, không xóa DOM) ──
  document.getElementById("quiz-screen").style.display = "none";
  const resultBox = document.getElementById("result-screen");
  document.getElementById("res-score").innerText      = payload.score;
  document.getElementById("res-percent").innerText    = payload.percentage;
  document.getElementById("res-time").innerText       = payload.time;
  document.getElementById("res-status").innerText     = "⏳ Đang lưu kết quả vào hệ thống...";
  resultBox.style.display = "block";

  // ── Gửi kết quả: thử JSONP trước, fallback sang fetch nếu lỗi ──
  var submitAttempted = false;

  function onSubmitSuccess() {
    if (submitAttempted) return;
    submitAttempted = true;
    document.getElementById("res-status").innerHTML =
      "✅ <b>Kết quả đã được lưu vào hệ thống thành công!</b>";
  }

  function onSubmitFail() {
    if (submitAttempted) return;
    // Thử lại bằng fetch (no-cors) như phương án dự phòng
    fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    }).then(function() {
      submitAttempted = true;
      document.getElementById("res-status").innerHTML =
        "✅ <b>Kết quả đã được gửi. Vui lòng chụp màn hình này để lưu lại làm bằng chứng.</b>";
    }).catch(function() {
      submitAttempted = true;
      document.getElementById("res-status").innerHTML =
        "⚠️ Mất kết nối — không lưu được vào hệ thống.<br>" +
        "<b style=\'color:red\'>Vui lòng chụp màn hình này và gửi cho Ban Tổ Chức!</b>";
    });
  }

  const cbName = "submitCB_" + Math.round(Math.random() * 1e8);
  const params = Object.keys(payload)
    .map(function(k) { return encodeURIComponent(k) + "=" + encodeURIComponent(payload[k]); })
    .join("&");

  // Timeout 10 giây: nếu JSONP không phản hồi thì fallback
  var submitTimeout = setTimeout(function() {
    delete window[cbName];
    var old2 = document.getElementById("_submitScript");
    if (old2) old2.remove();
    onSubmitFail();
  }, 10000);

  window[cbName] = function(resp) {
    clearTimeout(submitTimeout);
    delete window[cbName];
    var old2 = document.getElementById("_submitScript");
    if (old2) old2.remove();
    if (resp && resp.status === "success") {
      onSubmitSuccess();
    } else {
      onSubmitFail();
    }
  };

  const s = document.createElement("script");
  s.id  = "_submitScript";
  s.src = SCRIPT_URL + "?action=submitResult&callback=" + cbName + "&" + params;
  s.onerror = function() {
    clearTimeout(submitTimeout);
    onSubmitFail();
  };
  document.body.appendChild(s);
}</script>
